schema_version: 1

repository:
  id: "repo_01KX8PR825YW0SJWHW63B3PB8H"
  display_name: "macos-ubuntu-bootstrap"
  roles:
    - "module"
  lifecycle: "active"

provider:
  type: "github"
  installation: "installation:github-organization"
  repository_id: 1288547027
  owner: "NDDev-it-com"
  name: "macos-ubuntu-bootstrap"

classification:
  portfolios:
    - "portfolio:organization-projects"
    - "portfolio:public-modules"
  visibility_contract: "public"
  data_classification: "public"

policy:
  profiles:
    - "repository-default"
    - "organization-default"
    - "public-module"
  rollout_ring: "canary-modules"

git:
  default_branch: "main"
  integration: "pull-request"
  branch_model: "task-branches"
  handoff_pr: "preferred"
  cleanup: "merged-only"

verification:
  commands:
    # Reproduces what CI runs, prerequisite included. `python3 -m pytest` alone
    # only passed where pytest happened to be installed, which is the condition
    # this anchor exists to rule out. `.github/workflows/pytest.yml` and
    # `release.yml` both build the hash-locked virtualenv first.
    test:
      - "uv venv --python 3.14"
      - "uv pip install --require-hashes -r requirements-test.txt"
      - "bash scripts/ci/validate.sh"
      - ".venv/bin/python -m pytest -q"
  required:
    - "test"
  # The status checks the protected branch actually enforces, as check-run
  # names. Separate from `commands` on purpose: a required context is a check
  # run, not a command, and nothing derives one from the other. Declaring it is
  # what lets the consuming control plane detect drift in either direction --
  # a check the branch gains and the anchor does not name, or a check the anchor
  # claims that the branch no longer requires.
  #
  # `evidence-gate` is deliberately absent: it is in the checked-in projection
  # at .github/rulesets/branch-main.json but not yet in the live ruleset, and
  # this list states what is enforced, not what is intended. See
  # .github/rulesets/README.md for the pending delta.
  required_contexts:
    - "Dependency pin checks"
    - "Gitleaks secret scan / Gitleaks secret scan"
    - "bootstrap-gate"
    - "bootstrap-pytests / python (3.14)"
    - "cross-platform smoke (macos-latest) / smoke (macos-latest)"
    - "cross-platform smoke (ubuntu-latest) / smoke (ubuntu-latest)"
    - "dependency-review / Dependency review"

agent:
  context_profile: "public-module"
  generated_agents: false
  serena:
    enabled: true
    provenance_required: true

module:
  contract: "public"
  consumption:
    - "git-submodule"
  compatibility: "semver"
  pin_policy: "default-branch-commit"
  publication:
    registry: "none"
    github_release: "required"

release:
  mode: "github-release"
