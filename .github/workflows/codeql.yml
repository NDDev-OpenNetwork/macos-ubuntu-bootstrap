# Advanced setup owns code scanning for this repository. CodeQL *default setup*
# is `not-configured` here and this workflow is `active`; every analysis on
# record was produced by this file.
#
# It used to say the opposite. On the archived `NDDev-it-com` repository default
# setup did own scanning, from 2026-07-31, and this file was disabled. The header
# moved here with the republication and kept asserting it, so a reader was told
# the only thing scanning the repository does nothing — and was told to disable
# a default setup that does not exist before touching it. Verify with
# `GET /repos/{owner}/{repo}/code-scanning/default-setup` and
# `GET /repos/{owner}/{repo}/actions/workflows` rather than trusting this header;
# that is how the contradiction was found.
#
# Exactly one CodeQL mode is intended at a time. The current mode is `advanced`.
# Attachment is atomic: forcing default setup onto a repository with an active
# advanced setup fails the whole attachment, so switching means disabling this
# workflow first.
name: codeql-analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'

permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: codeql-analysis
    permissions:
      actions: read # Read workflow metadata for CodeQL analysis.
      contents: read
      security-events: write # Upload CodeQL SARIF to this repository.
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/public-codeql.yml@bc9c7919de1c39d947a8709a92856925051bae05 # commit:bc9c7919de1c39d947a8709a92856925051bae05
    with:
      # Public repo: pull_request runs untrusted fork code. Pin the hosted runner
      # explicitly — the reusable's `runner` default belongs to the pinned commit,
      # not to this repository, so inheriting it would let a pin bump move fork
      # PRs onto trusted private infrastructure with no diff here to review.
      runner: ubuntu-latest
      # Python is 61.7% of this repository by bytes and went unscanned from the
      # republication until 2026-08-23, because only `actions` was listed here
      # while the header claimed a default setup covering `actions` and `python`
      # was in charge. Both halves of that are now true in one place.
      languages: '["actions","python"]'
