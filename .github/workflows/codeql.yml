name: codeql-analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: codeql-analysis-actions
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: NDDev-it-com/ci-workflows/.github/workflows/public-codeql.yml@7f69c724923d06b2c2057c5a6ad341c37f1a8995 # 0.13.3
    with:
      languages: '["actions"]'
