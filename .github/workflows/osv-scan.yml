name: OSV scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: osv-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: OSV vulnerability scan
    permissions:
      contents: read
    uses: NDDev-it-com/ci-workflows/.github/workflows/osv-scan.yml@7f69c724923d06b2c2057c5a6ad341c37f1a8995 # 0.13.3
    with:
      scan_args: '--recursive .'
