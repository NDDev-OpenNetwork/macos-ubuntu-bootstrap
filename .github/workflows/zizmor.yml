name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Workflow security analysis
    permissions:
      # zizmor-sarif reads workflow run metadata from the Actions API. A caller
      # cannot grant a reusable more than it declares itself, so omitting
      # actions: read fails the run at startup before any job begins — which is
      # exactly what the 0.12.0 -> 0.13.3 repin surfaced here.
      actions: read
      contents: read
      security-events: write # SARIF upload to the Security tab
    uses: NDDev-it-com/ci-workflows/.github/workflows/zizmor-sarif.yml@7f69c724923d06b2c2057c5a6ad341c37f1a8995 # 0.13.3
    with:
      # Public repo: pull_request runs untrusted fork code. Pin the hosted runner
      # explicitly. The reusable's `runner` default belongs to the pinned commit,
      # not to this repository, and the estate's self-hosted label is now
      # `github-actions` — which reads like a hosted runner in a diff. Naming
      # the hosted runner here is what keeps that from slipping through.
      runner: ubuntu-latest
