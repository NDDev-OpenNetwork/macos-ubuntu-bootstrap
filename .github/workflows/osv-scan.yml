name: OSV scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: osv-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: OSV vulnerability scan
    permissions:
      contents: read
    uses: NDDev-it-com/ci-workflows/.github/workflows/osv-scan.yml@7f69c724923d06b2c2057c5a6ad341c37f1a8995 # 0.13.3
    with:
      # Public repo: pull_request runs untrusted fork code. Pin the hosted runner
      # explicitly. The reusable's `runner` default belongs to the pinned commit,
      # not to this repository, and the estate's self-hosted label is now
      # `github-actions` — which reads like a hosted runner in a diff. Naming
      # the hosted runner here is what keeps that from slipping through.
      runner: ubuntu-latest
      scan_args: '--recursive .'
