name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Workflow security analysis
    permissions:
      contents: read
      security-events: write # SARIF upload to the Security tab
    uses: NDDev-it-com/ci-workflows/.github/workflows/zizmor-sarif.yml@7f69c724923d06b2c2057c5a6ad341c37f1a8995 # 0.13.3
