name: dependency-check

on:
  schedule:
    - cron: "40 6 * * 1"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-pins:
    name: Dependency pin checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate verified vendor CLI installation
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          installers = [
              Path("scripts/macos/install.sh"),
              Path("scripts/ubuntu/install.sh"),
          ]
          common = Path("scripts/lib/common.sh")

          for path in installers:
              data = path.read_text(encoding="utf-8")
              if "install_ai_runtimes" not in data:
                  raise SystemExit(f"vendor CLI entrypoint missing in {path}")
          common_data = common.read_text(encoding="utf-8")
          for marker in (
              "rldyour::install_vendor_ai_clis",
              "RLDYOUR_CODEX_VERSION",
              "RLDYOUR_CODEX_PACKAGE_SHA512",
              "RLDYOUR_CLAUDE_INSTALLER_SHA256",
              "RLDYOUR_GROK_INSTALLER_SHA256",
              "rldyour::download_verified_file",
          ):
              if marker not in common_data:
                  raise SystemExit(f"verified vendor CLI marker missing in {common}: {marker}")
          if "curl -fsSL https://" in common_data and "| sh" in common_data:
              raise SystemExit("vendor installers must be downloaded and verified before execution")

          print("Codex, Claude Code, and Grok vendor CLI pins are verified")
          PY

      - name: Validate dependency-check intent
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "scripts/bootstrap.sh"
            "scripts/ci/validate.sh"
            "scripts/macos/install.sh"
            "scripts/ubuntu/install.sh"
          )

          for script in "${required[@]}"; do
            if [ ! -r "$script" ]; then
              echo "Missing required script: $script" >&2
              exit 1
            fi
          done
          echo "dependency intent verified"
