name: scorecard

on:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: OSSF Scorecard
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/public-scorecard-json.yml@706233fdc953d4281389c0fd5f8c1a007e19a1f5 # 0.1.15
    with:
      # Public repo: pull_request runs untrusted fork code. Pin the hosted runner
      # explicitly — the reusable's `runner` default belongs to the pinned commit,
      # not to this repository, so inheriting it would let a pin bump move fork
      # PRs onto trusted private infrastructure with no diff here to review.
      runner: ubuntu-latest
      publish_results: false
