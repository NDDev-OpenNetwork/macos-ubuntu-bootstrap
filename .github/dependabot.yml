version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/templates/browser/provider"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
      include: scope
    labels:
      - dependencies
      - npm
    groups:
      npm-minor:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
      npm-major:
        applies-to: version-updates
        update-types: ["major"]
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
