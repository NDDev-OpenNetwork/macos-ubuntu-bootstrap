name: PR hygiene

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-hygiene:
    name: PR hygiene
    permissions:
      contents: read
      pull-requests: write # labeler + stale jobs comment/label PRs
      issues: write # stale job manages issues
    uses: NDDev-it-com/ci-workflows/.github/workflows/pr-hygiene.yml@7f69c724923d06b2c2057c5a6ad341c37f1a8995 # 0.13.3
    with:
      # The reusable commitlint job (wagoid v6.2.1) fails with EISDIR here; keep
      # pr-title/labeler/stale and re-enable once ci-workflows fixes commitlint.
      commitlint: false
