name: cross-platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "20 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Proves the repository metadata contract every consumer reads before it runs
  # anything — the four files a caller resolves the adapter by. Platform
  # *behaviour* is not this lane's job: `ci.yml` runs the real installers in
  # plan mode, plus shellcheck and the cross-platform crosscheck, on both
  # supported operating systems.
  #
  # windows-latest was dropped: this adapter targets macOS and Ubuntu only, the
  # installers are Bash, and the check could not fail on Windows for any reason
  # that would not also fail on the other two. A required status check that
  # cannot express a real failure reports confidence it never earned — and it
  # still consumed runner minutes at the Windows multiplier on every push, PR
  # and weekly schedule.
  smoke:
    name: cross-platform smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
    uses: NDDev-it-com/ci-workflows/.github/workflows/cross-platform-smoke.yml@7f69c724923d06b2c2057c5a6ad341c37f1a8995 # 0.13.3
    # This reusable exposes no `runner` input at the pinned commit; the
    # hosted-runner rule therefore does not apply here. Re-check on a pin bump.
    with:
      os_list: '["${{ matrix.os }}"]'
      command: |
        python - <<'PY'
        from pathlib import Path
        import json
        import os

        required = [
          "README.md",
          "LICENSE",
          "NOTICE",
          "VERSION",
        ]
        missing = [path for path in required if not Path(path).exists()]
        if missing:
          raise SystemExit(f"missing required path(s): {', '.join(missing)}")

        manifest = {
          "os": os.environ.get("RUNNER_OS", "unknown"),
          "version_file": (Path("VERSION").read_text(encoding="utf-8").strip()),
        }
        print(json.dumps(manifest, sort_keys=True))
        print("cross-platform metadata smoke passed")
        PY
