name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-pytests:
    permissions:
      contents: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/python-ci.yml@409817cf743e76383c84e30c72edf781d73b71a1 # 0.1.11
    with:
      # Public repo: pull_request runs untrusted fork code. Pin the hosted runner
      # explicitly. The estate runner platform forbids public/fork code on a
      # trusted runner group (modules/github-actions, docs/threat-model.md),
      # and this repository is public. The reusable's default belongs to the
      # pinned commit, not here. A wrong value does not fail loudly either:
      # a job asking for a label no runner advertises queues indefinitely.
      runner: ubuntu-latest
      python_version: "3.14"
      # One script owns the test environment, and `.gds/repository.yaml`
      # declares the same one as its `bootstrap` lane. These steps used to live
      # here as a shell one-liner and nowhere else, so the module's own declared
      # verification lane began with `uv venv` on a host that might have neither
      # uv nor zsh — and this workflow's success said nothing about that,
      # because it was the thing supplying what the anchor omitted.
      #
      # What the script establishes and why is documented in the script.
      install_command: bash scripts/ci/setup-test-env.sh
      test_command: .venv/bin/python -m pytest -q
      timeout_minutes: 15
