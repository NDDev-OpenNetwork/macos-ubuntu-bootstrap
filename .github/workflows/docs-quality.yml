name: Docs quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: docs-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-quality:
    name: Docs quality
    permissions:
      contents: read
    uses: NDDev-it-com/ci-workflows/.github/workflows/docs-quality.yml@7f69c724923d06b2c2057c5a6ad341c37f1a8995 # 0.13.3
    with:
      # Public repo: pull_request runs untrusted fork code. Pin the hosted runner
      # explicitly. The estate runner platform forbids public/fork code on a
      # trusted runner group (modules/github-actions, docs/threat-model.md),
      # and this repository is public. The reusable's default belongs to the
      # pinned commit, not here, and the fleet's labels -- `standard`, legacy
      # `amsterdam` -- read like nothing in a diff.
      runner: ubuntu-latest
      # Broken-link detection (lychee). Exclude openai.com: its marketing pages
      # return 403 to link-checkers (bot-blocked) — a false positive, valid in a
      # browser.
      lychee_args: '--no-progress --max-concurrency 8 --exclude "openai\.com" "**/*.md"'
      # Spell-check and markdown-lint are disabled: `typos` scans the whole repo
      # and flags project identifiers as misspellings (the NDDev brand, hex
      # SHA-256 fragments), and default markdownlint rules (e.g. line length) are
      # noise on technical docs. Keep the high-signal broken-link gate.
      typos: false
      markdownlint: false
