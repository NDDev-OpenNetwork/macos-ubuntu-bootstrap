# INERT — this workflow does not run. CodeQL *default setup* owns code scanning
# for this repository (configured 2026-07-31 for `actions` and `python`), and
# enabling it disabled this advanced-setup workflow: the platform reports
# `state: disabled_manually` for this file. Its last run was 2026-07-03 and
# every recorded run failed.
#
# It is kept, not deleted, because default setup cannot express a pinned
# reusable caller and switching back is a one-setting change. Nothing here can
# tell you the file is disabled — check
# `GET /repos/{owner}/{repo}/actions/workflows` before assuming a committed
# workflow runs. Re-enabling it means disabling default setup first: attachment
# is atomic, and forcing default setup onto a repository with an active
# advanced setup fails the whole attachment.
#
# Exactly one CodeQL mode is intended at a time. The current mode is `default`.
name: codeql-analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: codeql-analysis-actions
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: NDDev-it-com/ci-workflows/.github/workflows/public-codeql.yml@7f69c724923d06b2c2057c5a6ad341c37f1a8995 # 0.13.3
    with:
      languages: '["actions"]'
