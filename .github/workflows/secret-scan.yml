name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks secret scan
    permissions:
      contents: read
    uses: NDDev-it-com/ci-workflows/.github/workflows/secret-scan.yml@7f69c724923d06b2c2057c5a6ad341c37f1a8995 # 0.13.3
