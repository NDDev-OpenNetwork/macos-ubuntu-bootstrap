name: scorecard

on:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: OSSF Scorecard
    permissions:
      id-token: write # Authenticate the optional Scorecard result publication.
      contents: read
      actions: read # Read workflow metadata for Scorecard analysis.
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/public-scorecard-json.yml@bc9c7919de1c39d947a8709a92856925051bae05 # commit:bc9c7919de1c39d947a8709a92856925051bae05
    with:
      # Public repo: pull_request runs untrusted fork code. Pin the hosted runner
      # explicitly — the reusable's `runner` default belongs to the pinned commit,
      # not to this repository, so inheriting it would let a pin bump move fork
      # PRs onto trusted private infrastructure with no diff here to review.
      runner: ubuntu-latest
      publish_results: false
