name: OSV scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: osv-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: OSV vulnerability scan
    permissions:
      contents: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/osv-scan.yml@a7b90bdf1ac12465cbd07072e3360442cfc8eec6 # 0.1.26
    with:
      # Public repo: pull_request runs untrusted fork code. Pin the hosted runner
      # explicitly. The estate runner platform forbids public/fork code on a
      # trusted runner group (modules/github-actions, docs/threat-model.md),
      # and this repository is public. The reusable's default belongs to the
      # pinned commit, not here. A wrong value does not fail loudly either:
      # a job asking for a label no runner advertises queues indefinitely.
      runner: ubuntu-latest
      # The version and digest the contract pins for a device, passed explicitly
      # so CI analyses this repository with the scanner its own users get.
      # Without them the caller inherits the provider's default, which was
      # 2.4.0 at this pin -- a different scanning pipeline, so CI and a
      # developer's machine could disagree about the same repository.
      #
      # `scripts/ci/check_ci_tool_parity.py` fails if these drift from
      # `config/rldyour-contract.json`. The provider downloads
      # `osv-scanner_linux_amd64`, which is the asset the contract's x64 digest
      # covers, so the value transfers exactly rather than by resemblance.
      osv_scanner_version: '2.6.0'
      osv_scanner_sha256: 'ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108'
      scan_args: '--recursive .'
